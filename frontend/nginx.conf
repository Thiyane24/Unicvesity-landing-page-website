user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # IMPORTANT:
    # In the container, the API service is reachable at "http://api:8000".
    # (api = the service name in docker-compose.yml). The upstream is overridable
    # at build time via the API_UPSTREAM build arg.
    upstream unicvesity_api {
        server ${API_UPSTREAM};
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static files (landing page, admin, logo)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Long-cache assets so the page loads fast on repeat visits.
        location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?|ttf|css|js)$ {
            try_files $uri =404;
            expires 30d;
            access_log off;
        }

        # ---- Reverse proxy: /api/* → backend container ----
        # Keeps cookie / CORS / Authorization headers intact and means the
        # browser sees a single origin, so the frontend code's
        # apiBaseUrl stays unchanged at runtime.
        location /api/ {
            proxy_pass         http://unicvesity_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # CSV exports can be slow on huge tables; bump timeouts.
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Admin panel is exposed on the same origin for convenience.
        # Internal lock — protect /api/admin/* with Bearer token, not URL.
        location = /admin {
            return 301 /admin.html;
        }
    }
}
